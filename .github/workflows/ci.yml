name: ORVIKA CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validate_android:
        description: "Run the deferred Android validation batch (only when explicitly ready)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: orvika-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-validation:
    name: Android build validation
    # Android work is deliberately excluded from automatic PR/push validation.
    # It runs only after an explicit manual dispatch with validate_android=true.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_android == true
    uses: ./.github/workflows/android-build.yml
    # No repository secrets are inherited by the reusable build.
    
  refresh-lockfile:
    name: Regenerate root npm lockfile without deployment toolchains
    if: github.event_name == 'pull_request' && github.head_ref == 'security/2026-11-23-dependency-hardening'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5

      - name: Regenerate lockfile from the reduced dependency manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit regenerated lockfile when changed
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "The lockfile is already synchronized."
          else
            git add package-lock.json
            git commit -m "chore(security): regenerate npm lockfile without deployment toolchains"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

  flutter:
    name: Analyze, test and build Web
    needs: refresh-lockfile
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5

      - name: Install integrity-pinned npm tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Collect npm dependency advisory evidence
        shell: bash
        run: |
          mkdir -p security-evidence
          full_status=0
          npm audit --json > security-evidence/npm-audit-full.json || full_status=$?
          optional_status=0
          npm audit --omit=optional --json > security-evidence/npm-audit-nonoptional.json || optional_status=$?
          echo "npm audit (full lockfile) process exit code: $full_status"
          echo "npm audit (non-optional dependencies) process exit code: $optional_status"
          node -e "const fs=require('node:fs'); for (const file of ['security-evidence/npm-audit-full.json','security-evidence/npm-audit-nonoptional.json']) { const report=JSON.parse(fs.readFileSync(file,'utf8')); if (report.error) { console.log(file+': audit service reported an error.'); continue; } const v=report.vulnerabilities || {}; const counts=Object.values(v).reduce((a,x)=>(a[x.severity]=(a[x.severity]||0)+1,a),{}); console.log(file+': '+JSON.stringify(counts)); }"

      - name: Enforce zero advisories across the complete npm dependency tree
        run: npm audit --audit-level=low

      - name: Upload npm dependency advisory evidence
        if: always() && hashFiles('security-evidence/npm-audit-full.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-npm-audit-evidence
          path: security-evidence/npm-*
          if-no-files-found: warn
          retention-days: 14

      - name: Run edge middleware regression and property tests
        run: npm run test:edge

      - name: Validate edge middleware and application source
        run: |
          node --check functions/_middleware.js
          npm run test:edge
          npm run verify:source

      - name: Install Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          # Fetch the matching release tag so Flutter can resolve its SDK version.
          # The tag is verified against the already-pinned immutable commit.
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse 3.47.9^{commit})" = "c197ca5199e9ee5661e865596c9c07294dfab51c"
          git -C "$RUNNER_TEMP/flutter" checkout --detach c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Web
        run: |
          flutter build web --release --csp --no-web-resources-cdn
          test -s build/web/canvaskit/canvaskit.js
          test -s build/web/canvaskit/canvaskit.wasm

