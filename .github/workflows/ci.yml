name: ORVIKA CI
# Re-trigger after repository Actions allowlist configuration update.

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orvika-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze, test and build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Web
        run: flutter build web --release
