name: ORVIKA CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy the validated main-branch build to Vercel production"
        required: true
        type: boolean
        default: false
      validate_android:
        description: "Run the deferred Android validation batch (only when explicitly ready)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: orvika-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-npm-lockfile:
    name: Refresh npm integrity lockfile on trusted PR branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout the pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Refresh lockfile with registry integrity metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Committed npm lockfile is already current."
          else
            git commit -m "chore: refresh integrity-verified npm lockfile"
            git push origin "HEAD:${PR_BRANCH}"
          fi

  android-validation:
    name: Android build validation
    # Android work is deliberately excluded from automatic PR/push validation.
    # It runs only after an explicit manual dispatch with validate_android=true.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_android == true
    uses: ./.github/workflows/android-build.yml
    # No repository secrets are inherited by the reusable build.
    
  flutter:
    name: Analyze, test, build and deploy Web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install integrity-pinned npm tools
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Collect npm dependency advisory evidence
        shell: bash
        run: |
          mkdir -p security-evidence
          full_status=0
          npm audit --json > security-evidence/npm-audit-full.json || full_status=$?
          optional_status=0
          npm audit --omit=optional --json > security-evidence/npm-audit-nonoptional.json || optional_status=$?
          echo "npm audit (full lockfile) process exit code: $full_status"
          echo "npm audit (non-optional dependencies) process exit code: $optional_status"
          node -e "const fs=require('node:fs'); for (const file of ['security-evidence/npm-audit-full.json','security-evidence/npm-audit-nonoptional.json']) { const report=JSON.parse(fs.readFileSync(file,'utf8')); if (report.error) { console.log(file+': audit service reported an error.'); continue; } const v=report.vulnerabilities || {}; const counts=Object.values(v).reduce((a,x)=>(a[x.severity]=(a[x.severity]||0)+1,a),{}); console.log(file+': '+JSON.stringify(counts)); }"

      - name: Enforce zero advisories in non-optional npm dependencies
        run: npm audit --omit=optional --audit-level=moderate

      - name: Record platform-specific Vercel CLI dependency selection
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const names = [
            '@vercel/vc-native-linux-x64',
            '@vercel/cli-support',
            '@vercel/container',
            '@vercel/node',
            'tar',
            'undici',
            'js-yaml',
            'minimatch',
            'path-to-regexp',
            'smol-toml',
          ];
          const installed = Object.fromEntries(names.map((name) => [
            name,
            fs.existsSync(path.join('node_modules', ...name.split('/'))),
          ]));
          fs.writeFileSync(
            'security-evidence/npm-platform-installation.json',
            JSON.stringify({ platform: process.platform, arch: process.arch, installed }, null, 2) + '\\n',
          );
          console.log('Recorded the actual platform-specific npm installation set.');
          NODE

      - name: Upload npm dependency advisory evidence
        if: always() && hashFiles('security-evidence/npm-audit-full.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-npm-audit-evidence
          path: security-evidence/npm-*
          if-no-files-found: warn
          retention-days: 14

      - name: Validate deployment verification scripts
        run: |
          node --check .github/scripts/orvika-browser-smoke.cjs
          node --check .github/scripts/verify-vercel-output.cjs
          node --check functions/_middleware.js
          npm run test:edge
          npm run verify:source
          wrangler pages functions build functions --outfile "$RUNNER_TEMP/orvika-pages-worker.js"
          test -s "$RUNNER_TEMP/orvika-pages-worker.js"

      - name: Validate Vercel deployment and header configuration
        run: |
          node -e "const c=require('./vercel.json'); const h=Object.fromEntries((c.headers||[]).flatMap(x=>x.headers||[]).map(x=>[x.key.toLowerCase(),x.value])); const required=['strict-transport-security','x-content-type-options','x-frame-options','referrer-policy','permissions-policy','content-security-policy','cross-origin-embedder-policy','cross-origin-opener-policy']; for (const k of required) if (!h[k]) throw new Error('Missing Vercel response header: '+k); if (!/default-src 'none'/.test(h['content-security-policy']) || !/script-src[^;]*'wasm-unsafe-eval'/.test(h['content-security-policy']) || /script-src[^;]*'unsafe-eval'/.test(h['content-security-policy'])) throw new Error('CSP is missing required Flutter-safe directives or permits unsafe-eval.'); if (h['cross-origin-embedder-policy'] !== 'credentialless') throw new Error('Unexpected COEP policy.'); if (h['cross-origin-opener-policy'] !== 'same-origin') throw new Error('Unexpected COOP policy.'); if (c.git?.deploymentEnabled !== false) throw new Error('Vercel Git auto-deployments must remain disabled; GitHub Actions is the deployment authority.'); if (c.outputDirectory !== 'build/web') throw new Error('Vercel outputDirectory must remain build/web for the prebuilt Flutter Web artifact.');"

      - name: Install Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          # Fetch the matching release tag so Flutter can resolve its SDK version.
          # The tag is verified against the already-pinned immutable commit.
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse 3.47.9^{commit})" = "c197ca5199e9ee5661e865596c9c07294dfab51c"
          git -C "$RUNNER_TEMP/flutter" checkout --detach c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Web
        run: |
          flutter build web --release --csp --no-web-resources-cdn
          test -s build/web/canvaskit/canvaskit.js
          test -s build/web/canvaskit/canvaskit.wasm

      - name: Link Vercel project without Git integration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        shell: bash
        env:
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Configure Vercel project build settings
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel project update orvika-web --yes --framework other --build-command "echo 'Using prebuilt Flutter Web output'" --output-directory "build/web" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Pull Vercel production configuration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Prepare Vercel deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify generated Vercel security-header routes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        run: node .github/scripts/verify-vercel-output.cjs

      - name: Deploy prebuilt Web output to Vercel
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        run: |
          playwright install --with-deps chromium

      - name: Browser smoke test production deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          ORVIKA_BASE_URL: https://orvika-web.vercel.app
        run: node .github/scripts/orvika-browser-smoke.cjs
