name: ORVIKA CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy the validated main-branch build to Vercel production"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: orvika-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Determine Android validation scope
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.scope.outputs.android }}
    steps:
      - name: Classify pull request changes
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename')"
          if [ -z "$files" ]; then
            echo "Could not retrieve changed files; failing closed." >&2
            exit 1
          fi

          # Android validation is retained for all application, platform,
          # dependency, and Android-workflow changes. It is skipped only when
          # every changed file is documentation, plus this dispatcher workflow.
          if grep -qvE '^(docs/.*|[^/]+\.md|functions/.*|\.github/scripts/cloudflare-middleware\.test\.mjs|\.github/workflows/(ci|cloudflare-pages)\.yml)$' <<< "$files"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  android-validation:
    name: Android release build validation
    needs: change-scope
    if: needs.change-scope.outputs.android == 'true'
    uses: ./.github/workflows/android-build.yml

  flutter:
    name: Analyze, test, build and deploy Web
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Test Cloudflare Pages request guard
        run: node --test .github/scripts/cloudflare-middleware.test.mjs

      - name: Validate Cloudflare Pages Functions bundle
        run: npx --yes wrangler@4 pages functions build functions --outdir "$RUNNER_TEMP/orvika-pages-functions"

      - name: Validate deployment verification scripts
        run: |
          node --check .github/scripts/orvika-browser-smoke.cjs
          node --check .github/scripts/verify-vercel-output.cjs

      - name: Validate Vercel deployment and header configuration
        run: |
          node -e "const c=require('./vercel.json'); const h=Object.fromEntries((c.headers||[]).flatMap(x=>x.headers||[]).map(x=>[x.key.toLowerCase(),x.value])); const required=['strict-transport-security','x-content-type-options','x-frame-options','referrer-policy','permissions-policy','content-security-policy','cross-origin-embedder-policy','cross-origin-opener-policy']; for (const k of required) if (!h[k]) throw new Error('Missing Vercel response header: '+k); if (!/default-src 'none'/.test(h['content-security-policy']) || !/script-src[^;]*'wasm-unsafe-eval'/.test(h['content-security-policy']) || /script-src[^;]*'unsafe-eval'/.test(h['content-security-policy'])) throw new Error('CSP is missing required Flutter-safe directives or permits unsafe-eval.'); if (h['cross-origin-embedder-policy'] !== 'credentialless') throw new Error('Unexpected COEP policy.'); if (h['cross-origin-opener-policy'] !== 'same-origin-allow-popups') throw new Error('Unexpected COOP policy.'); if (c.git?.deploymentEnabled !== false) throw new Error('Vercel Git auto-deployments must remain disabled; GitHub Actions is the deployment authority.'); if (c.outputDirectory !== 'build/web') throw new Error('Vercel outputDirectory must remain build/web for the prebuilt Flutter Web artifact.');"

      - name: Install Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.47.9
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Web
        run: |
          flutter build web --release --csp --no-web-resources-cdn
          test -s build/web/canvaskit/canvaskit.js
          test -s build/web/canvaskit/canvaskit.wasm

      - name: Install Vercel CLI
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        run: npm install --global vercel@latest

      - name: Link Vercel project without Git integration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        shell: bash
        env:
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Configure Vercel project build settings
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel project update orvika-web --yes --framework other --build-command "echo 'Using prebuilt Flutter Web output'" --output-directory "build/web" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Pull Vercel production configuration
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Prepare Vercel deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel build --prod --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify generated Vercel security-header routes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        run: node .github/scripts/verify-vercel-output.cjs

      - name: Deploy prebuilt Web output to Vercel
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_02VuKyXLkw0xooJjMMKvYUK3
          VERCEL_PROJECT_ID: prj_bHaSgv8y0tcFEGDJaEppYx8I0ZV0
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser smoke test production deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
        env:
          ORVIKA_BASE_URL: https://orvika-web.vercel.app
        run: node .github/scripts/orvika-browser-smoke.cjs
