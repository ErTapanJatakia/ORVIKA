name: Mirror GitHub main to GitVerse

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitverse-mirror-main
  cancel-in-progress: false

jobs:
  mirror:
    name: Push main to GitVerse
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitVerse SSH authentication
        env:
          GITVERSE_SSH_PRIVATE_KEY: ${{ secrets.GITVERSE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITVERSE_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing repository secret GITVERSE_SSH_PRIVATE_KEY."
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "${GITVERSE_SSH_PRIVATE_KEY}" > ~/.ssh/gitverse_ed25519
          chmod 600 ~/.ssh/gitverse_ed25519

          # Pinned RSA host key published in GitVerse's official SSH fingerprint documentation.
          cat > ~/.ssh/known_hosts <<'EOF'
          gitverse.ru ssh-rsa 
          EOF
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<'EOF'
          Host gitverse.ru
            HostName gitverse.ru
            User git
            IdentityFile ~/.ssh/gitverse_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Push GitHub main to GitVerse
        run: |
          set -euo pipefail
          git remote add gitverse git@gitverse.ru:ErTapanJatakia/ORVIKA.git
          # Deliberately no force-push: unexpected divergence fails safely.
          git push gitverse refs/heads/main:refs/heads/main
          git push gitverse --tags
