name: ORVIKA wxscan Web Feasibility

on:
  push:
    branches: [spike/wxscan-web-feasibility]
    paths:
      - "tool/wxscan_spike/**"
      - ".github/workflows/wxscan-spike.yml"
  pull_request:
    branches: [main]
    paths:
      - "tool/wxscan_spike/**"
      - ".github/workflows/wxscan-spike.yml"

permissions:
  contents: read

concurrency:
  group: wxscan-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-feasibility:
    name: Build and exercise wxscan Web runtime in Chromium and Firefox
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout ORVIKA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout pinned wxscan Rust sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wilinz/wxscan-rs
          ref: 8efaca7abf9508edb46c799713d74be7761b2464
          path: _rust/wxscan-rs

      - name: Checkout pinned Rust workspace dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wilinz/cvlite
          ref: 6a1b0370720c2ee813be5845280cfe98005c254c
          path: _rust/cvlite

      - name: Checkout pinned Rust workspace dependencies
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: wilinz/wxing
          ref: eb8fb50b8091de3b65e75a034e42a40009a8f34c
          path: _rust/wxing

      - name: Build wxscan WebAssembly from pinned source
        working-directory: _rust/wxscan-rs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cargo
          printf '[patch.crates-io]\ncvlite = { path = "../cvlite" }\nwxing = { path = "../wxing" }\n' > .cargo/config.toml
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo +1.95.0 build -p wxscan-wasm --target wasm32-unknown-unknown --profile wasm
          test -s target/wasm32-unknown-unknown/wasm/wxscan_wasm.wasm

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.47.9
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/dart" --version

      - name: Download and verify pinned CNN model weights
        working-directory: tool/wxscan_spike
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models assets/fixtures
          base="https://raw.githubusercontent.com/wilinz/wxscan-weights/f60bbdbaa8dc8662050948328ae4faa957a5e0cd/models"
          curl --fail --location --silent --show-error "$base/detect.tflite" -o assets/models/detect.tflite
          curl --fail --location --silent --show-error "$base/sr.tflite" -o assets/models/sr.tflite
          echo "de3753a21b953f3f41372e07087cb23e7f698bae01909225ea47f575e65dc0f2  assets/models/detect.tflite" | sha256sum --check -
          echo "5e73c5723b827b58244c8a90c696bbd6219b5a65d742a7bdc235002b4741bb65  assets/models/sr.tflite" | sha256sum --check -

      - name: Generate deterministic synthetic QR fixture
        working-directory: tool/wxscan_spike
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "qrcode[pil]==8.2" "Pillow==12.0.0"
          python3 - <<'PY'
          import qrcode
          from qrcode.constants import ERROR_CORRECT_H
          qr = qrcode.QRCode(version=None, error_correction=ERROR_CORRECT_H, box_size=12, border=4)
          qr.add_data("ORVIKA-WXSCAN-FEASIBILITY-2026")
          qr.make(fit=True)
          qr.make_image(fill_color="black", back_color="white").convert("RGB").save("assets/fixtures/qr.png")
          PY
          test -s assets/fixtures/qr.png

      - name: Resolve isolated dependency
        working-directory: tool/wxscan_spike
        run: flutter pub get

      - name: Assemble browser runtime with pinned checksums
        working-directory: tool/wxscan_spike
        shell: bash
        run: |
          set -euo pipefail
          package_root=$(find "$HOME/.pub-cache/hosted/pub.dev" -maxdepth 1 -type d -name 'wxscan-0.1.7' -print -quit)
          test -n "$package_root"
          mkdir -p web/wxscan
          cp "$package_root/lib/src/web/assets/wxscan_worker.js" web/wxscan/
          cp "$GITHUB_WORKSPACE/_rust/wxscan-rs/target/wasm32-unknown-unknown/wasm/wxscan_wasm.wasm" web/wxscan/
          lock="$package_root/tool/web.lock"
          value() { grep "^$1=" "$lock" | head -1 | cut -d= -f2-; }
          repo=$(value TFLITE_REPO)
          tag=$(value TFLITE_TAG)
          for file in wxscan_tflite.js wxscan_tflite.wasm; do
            curl --fail --location --silent --show-error \
              "https://github.com/$repo/releases/download/$tag/$file" \
              -o "web/wxscan/$file"
          done
          echo "$(value TFLITE_JS_SHA256)  web/wxscan/wxscan_tflite.js" | sha256sum --check -
          echo "$(value TFLITE_WASM_SHA256)  web/wxscan/wxscan_tflite.wasm" | sha256sum --check -
          test "$(find web/wxscan -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Analyze isolated harness
        working-directory: tool/wxscan_spike
        run: flutter analyze --fatal-infos

      - name: Build isolated Flutter Web release
        working-directory: tool/wxscan_spike
        run: flutter build web --release

      - name: Verify browser runtime and model assets are packaged
        working-directory: tool/wxscan_spike
        shell: bash
        run: |
          set -euo pipefail
          for file in wxscan_worker.js wxscan_wasm.wasm wxscan_tflite.js wxscan_tflite.wasm; do
            test -s "build/web/wxscan/$file"
          done
          test -s build/web/assets/assets/models/detect.tflite
          test -s build/web/assets/assets/models/sr.tflite

      - name: Install Playwright browsers
        working-directory: tool/wxscan_spike
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox

      - name: Exercise worker and CNN decode in Chromium and Firefox
        working-directory: tool/wxscan_spike
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory build/web > "$RUNNER_TEMP/wxscan-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          BROWSER=chromium node scripts/browser_smoke.mjs
          BROWSER=firefox node scripts/browser_smoke.mjs
