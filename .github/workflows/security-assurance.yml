name: ORVIKA Free Security Assurance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvika-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository, dependency, secret and configuration scans
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare evidence directory
        run: mkdir -p security-evidence

      - name: Trivy filesystem scan (vulnerabilities, misconfiguration, secrets and licences)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2 fs \
            --scanners vuln,misconfig,secret,license \
            --format json --output /repo/security-evidence/trivy-fs.json /repo
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.2 fs \
            --scanners vuln,misconfig,secret,license --severity HIGH,CRITICAL \
            --exit-code 1 /repo
      - name: Semgrep Community Edition SAST (including experimental Dart rules)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.180.0 \
            semgrep scan --config p/security-audit --config p/secrets \
            --json --output /src/security-evidence/semgrep.json /src
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.180.0 \
            semgrep scan --config p/security-audit --config p/secrets \
            --sarif --output /src/security-evidence/semgrep.sarif /src

      - name: Upload Semgrep SARIF to GitHub code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: security-evidence/semgrep.sarif

      - name: Install pinned Flutter SDK for authoritative Pub dependency graph
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse 3.47.9^{commit})" = "c197ca5199e9ee5661e865596c9c07294dfab51c" # DevSkim: ignore DS173237 -- public immutable Flutter source commit pin, not a credential.
          git -C "$RUNNER_TEMP/flutter" checkout --detach c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Resolve locked Pub dependencies and export authoritative graph
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          dart pub deps --json > security-evidence/pub-deps.json
          python3 -m json.tool security-evidence/pub-deps.json > /dev/null

      - name: Generate repository CycloneDX SBOM inventory
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" anchore/syft:v1.18.1 \
            scan dir:/src -o cyclonedx-json=/src/security-evidence/repository-sbom.cdx.json

      - name: Add and verify authoritative Pub dependency relationships
        shell: bash
        run: |
          python3 scripts/merge_pub_deps_into_cyclonedx.py \
            --sbom security-evidence/repository-sbom.cdx.json \
            --pub-deps security-evidence/pub-deps.json \
            --output security-evidence/repository-sbom-with-deps.cdx.json

      - name: Run security regression tests (AAB manifest and SBOM dependency graph)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/aab-verifier-venv"
          printf '%s\n' "defusedxml==0.7.1 --hash=sha256:a352e7e428770286cc899e2542b6cdaedb2b4953ff269a210103ec58f6198a61" > "$RUNNER_TEMP/aab-verifier-requirements.txt"
          "$RUNNER_TEMP/aab-verifier-venv/bin/pip" install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/aab-verifier-requirements.txt"
          "$RUNNER_TEMP/aab-verifier-venv/bin/python" -m unittest discover -s scripts/tests -p "test_*.py"

      - name: Gitleaks full-history secret scan
        shell: bash
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source=/repo --redact --report-format=json \
            --report-path=/repo/security-evidence/gitleaks.json --exit-code 1
      - name: Upload repository scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-repository-security-evidence
          path: security-evidence/
          if-no-files-found: warn
          retention-days: 14

  repository-posture:
    name: OpenSSF Scorecard repository posture
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: scorecard.sarif

  web-passive-dast:
    name: Passive DAST of dedicated Cloudflare preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify dedicated preview is reachable
        run: curl --fail --silent --show-error --head https://orvika-validation.orvika.pages.dev
      - name: Prepare ZAP evidence directory
        run: mkdir -p security-evidence
      - name: Run OWASP ZAP passive baseline scan
        shell: bash
        run: |
          chmod 777 security-evidence
          docker run --rm -v "$PWD/security-evidence:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t https://orvika-validation.orvika.pages.dev \
            -m 3 -I -J zap-baseline.json -r zap-baseline.html
      - name: Upload ZAP passive scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-web-zap-passive-evidence
          path: security-evidence/
          if-no-files-found: warn
          retention-days: 14

  android-apk-static-analysis:
    name: Build and publish isolated Android assessment APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select JDK 17
        shell: bash
        run: |
          if [ -z "${JAVA_HOME_17_X64:-}" ]; then
            echo "JDK 17 is not available on this runner." >&2
            exit 1
          fi
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin c197ca5199e9ee5661e865596c9c07294dfab51c
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.9:refs/tags/3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse 3.47.9^{commit})" = "c197ca5199e9ee5661e865596c9c07294dfab51c" # DevSkim: ignore DS173237 -- public immutable Flutter source commit pin, not a credential.
          git -C "$RUNNER_TEMP/flutter" checkout --detach c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Configure plugin repositories for the pinned Flutter included build
        shell: bash
        run: |
          SETTINGS="$RUNNER_TEMP/flutter/packages/flutter_tools/gradle/settings.gradle.kts"
          python3 - "$SETTINGS" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text()

          def block_bounds(source: str, marker: str):
              start = source.find(marker)
              if start < 0:
                  return None
              opening = source.find("{", start)
              if opening < 0:
                  raise SystemExit(f"Malformed {marker} block")
              depth = 0
              for index in range(opening, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return start, opening, index
              raise SystemExit(f"Unclosed {marker} block")

          plugin = block_bounds(content, "pluginManagement")
          if plugin is None:
              content = "pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\n" + content
              plugin = block_bounds(content, "pluginManagement")

          _, plugin_open, plugin_close = plugin
          plugin_body = content[plugin_open + 1:plugin_close]
          repositories = block_bounds(plugin_body, "repositories")
          if repositories is None:
              insertion = "\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n"
              content = content[:plugin_close] + insertion + content[plugin_close:]
          else:
              _, repo_open, repo_close = repositories
              repo_body = plugin_body[repo_open + 1:repo_close]
              missing = [name for name in ("google()", "mavenCentral()", "gradlePluginPortal()") if name not in repo_body]
              if missing:
                  addition = "".join(f"\n        {name}" for name in missing)
                  absolute_close = plugin_open + 1 + repo_close
                  content = content[:absolute_close] + addition + "\n    " + content[absolute_close:]

          path.write_text(content)
          verified = block_bounds(content, "pluginManagement")
          _, verified_open, verified_close = verified
          plugin_body = content[verified_open + 1:verified_close]
          repositories = block_bounds(plugin_body, "repositories")
          if repositories is None:
              raise SystemExit("Flutter included build has no pluginManagement.repositories block")
          _, repo_open, repo_close = repositories
          repo_body = plugin_body[repo_open + 1:repo_close]
          required = ("google()", "mavenCentral()", "gradlePluginPortal()")
          if not all(item in repo_body for item in required):
              raise SystemExit("Flutter included-build plugin repositories are incomplete")
          print("Verified Google, Maven Central and Gradle Plugin Portal inside pluginManagement.repositories.")
          print(repo_body.strip())
          PY
      - name: Verify committed Gradle wrapper and distribution checksum
        shell: bash
        run: |
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-' android/gradle/wrapper/gradle-wrapper.properties
          grep -Eq '^distributionSha256Sum=[a-f0-9]{64}$' android/gradle/wrapper/gradle-wrapper.properties
          android/gradlew --version
      - name: Diagnose Kotlin 2.2.21 Maven artifact availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-evidence
          EVIDENCE="$GITHUB_WORKSPACE/security-evidence/kotlin-2.2.21-repository-diagnostics.txt"
          BODY="$RUNNER_TEMP/kotlin-2.2.21-pom.xml"
          : > "$EVIDENCE"
          artifacts=(
            "org/jetbrains/kotlin/kotlin-stdlib/2.2.21/kotlin-stdlib-2.2.21.pom"
            "org/jetbrains/kotlin/kotlin-gradle-plugins-bom/2.2.21/kotlin-gradle-plugins-bom-2.2.21.pom"
            "org/jetbrains/kotlin/kotlin-gradle-plugin-api/2.2.21/kotlin-gradle-plugin-api-2.2.21.pom"
            "org/jetbrains/kotlin/kotlin-gradle-plugin/2.2.21/kotlin-gradle-plugin-2.2.21.pom"
          )
          failed=0
          for path in "${artifacts[@]}"; do
            url="https://repo.maven.apache.org/maven2/$path"
            printf 'Checking %s\n' "$url" | tee -a "$EVIDENCE"
            if ! metadata="$(curl --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 --silent --show-error --location \
              --output "$BODY" \
              --write-out 'http_status=%{http_code} content_type=%{content_type} bytes=%{size_download} effective_url=%{url_effective}' \
              "$url")"; then
              printf 'transport_error=1 %s\n' "$metadata" | tee -a "$EVIDENCE"
              failed=1
              continue
            fi
            printf '%s\n' "$metadata" | tee -a "$EVIDENCE"
            status="$(printf '%s' "$metadata" | sed -n 's/.*http_status=\([0-9][0-9][0-9]\).*/\1/p')"
            if [ "$status" = "429" ]; then
              fallback_url="https://plugins.gradle.org/m2/$path"
              echo "WARN: Maven Central rate-limited this runner (HTTP 429); checking the configured Gradle Plugin Portal fallback." | tee -a "$EVIDENCE"
              if fallback_metadata="$(curl --retry 2 --retry-all-errors --retry-delay 2 \
                --connect-timeout 10 --max-time 30 --silent --show-error --location \
                --output "$BODY" \
                --write-out 'http_status=%{http_code} content_type=%{content_type} bytes=%{size_download} effective_url=%{url_effective}' \
                "$fallback_url")"; then
                printf 'fallback_%s\n' "$fallback_metadata" | tee -a "$EVIDENCE"
                fallback_status="$(printf '%s' "$fallback_metadata" | sed -n 's/.*http_status=\([0-9][0-9][0-9]\).*/\1/p')"
                if [ "$fallback_status" = "200" ] && python3 - "$BODY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if root.tag.rsplit("}", 1)[-1] != "project":
              raise SystemExit("POM root element is not <project>")
          PY
                then
                  echo "PASS: valid POM available from configured Gradle Plugin Portal fallback" | tee -a "$EVIDENCE"
                  continue
                fi
              fi
              echo "FAIL: Maven Central was rate-limited and the configured fallback did not provide a valid POM for $path" | tee -a "$EVIDENCE"
              failed=1
              continue
            fi
            if [ "$status" != "200" ]; then
              echo "FAIL: expected HTTP 200 for $path" | tee -a "$EVIDENCE"
              failed=1
              continue
            fi
            if ! python3 - "$BODY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if root.tag.rsplit("}", 1)[-1] != "project":
              raise SystemExit("POM root element is not <project>")
          PY
            then
              echo "FAIL: response was not a valid Maven POM: $path" | tee -a "$EVIDENCE"
              failed=1
              continue
            fi
            echo "PASS: HTTP 200 and valid Maven POM" | tee -a "$EVIDENCE"
          done

          plugin_url="https://plugins.gradle.org/m2/org/jetbrains/kotlin/kotlin-gradle-plugin/2.2.21/kotlin-gradle-plugin-2.2.21.pom"
          printf 'Checking %s\n' "$plugin_url" | tee -a "$EVIDENCE"
          if metadata="$(curl --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 --silent --show-error --location \
            --output "$BODY" \
            --write-out 'http_status=%{http_code} content_type=%{content_type} bytes=%{size_download} effective_url=%{url_effective}' \
            "$plugin_url")"; then
            printf '%s\n' "$metadata" | tee -a "$EVIDENCE"
            status="$(printf '%s' "$metadata" | sed -n 's/.*http_status=\([0-9][0-9][0-9]\).*/\1/p')"
            if [ "$status" != "200" ] || ! python3 - "$BODY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          if root.tag.rsplit("}", 1)[-1] != "project":
              raise SystemExit("POM root element is not <project>")
          PY
            then
              echo "FAIL: Gradle Plugin Portal Kotlin plugin POM unavailable or invalid" | tee -a "$EVIDENCE"
              failed=1
            else
              echo "PASS: HTTP 200 and valid Maven POM" | tee -a "$EVIDENCE"
            fi
          else
            echo "FAIL: transport error querying Gradle Plugin Portal" | tee -a "$EVIDENCE"
            failed=1
          fi

          cat "$EVIDENCE"
          if [ "$failed" -ne 0 ]; then
            echo "Kotlin dependency repository diagnostics failed; stopping before Gradle project configuration." >&2
            exit 1
          fi
      - name: Upload Kotlin repository diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-kotlin-repository-diagnostics
          path: security-evidence/kotlin-2.2.21-repository-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Resolve locked Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Create ephemeral assessment signing identity
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/orvika-assessment-only.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -alias orvika-assessment -keyalg RSA -keysize 3072 -validity 7 \
            -dname "CN=ORVIKA Temporary Security Assessment, OU=CI, O=ORVIKA"
          chmod 600 "$KEYSTORE"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "ORVIKA_UPLOAD_STORE_FILE=$KEYSTORE"
            echo "ORVIKA_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORVIKA_UPLOAD_KEY_ALIAS=orvika-assessment"
            echo "ORVIKA_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build isolated release-mode assessment APK (never a store release)
        run: flutter build apk --release --no-pub
      - name: Verify APK identity, signature and digest
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -n 1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          mkdir -p security-evidence
          "$APKSIGNER" verify --verbose --print-certs "$APK" > security-evidence/apk-signature.txt 2>&1
          "$AAPT" dump badging "$APK" > security-evidence/apk-identity.txt
          sha256sum "$APK" > security-evidence/apk-sha256.txt
      - name: Record assessment APK metadata
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          {
            grep -E '^(package:|application-label:|sdkVersion:|targetSdkVersion:)' security-evidence/apk-identity.txt || true
            echo "APK SHA-256: $(sha256sum "$APK" | cut -d ' ' -f 1)"
            echo "Signing: ephemeral CI-only RSA-3072 certificate; not a store signing identity."
            echo "Purpose: external security assessment only; not for RuStore submission."
          } > security-evidence/apk-assessment-metadata.txt
      - name: Upload assessment APK and verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-android-assessment-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            security-evidence/apk-identity.txt
            security-evidence/apk-signature.txt
            security-evidence/apk-sha256.txt
            security-evidence/apk-assessment-metadata.txt
          if-no-files-found: error
          retention-days: 14

  devskim-sast:
    name: DevSkim source security lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare DevSkim evidence directory
        run: mkdir -p security-evidence
      - name: Run Microsoft DevSkim
        uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221
        with:
          directory-to-scan: .
          output-filename: devskim-results.sarif
          output-directory: security-evidence
      - name: Upload DevSkim SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: security-evidence/devskim-results.sarif
      - name: Preserve DevSkim SARIF for evidence review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-devskim-sarif-evidence
          path: security-evidence/devskim-results.sarif
          if-no-files-found: error
          retention-days: 14

  bandit-python-sast:
    name: Bandit Python security analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run PyCQA Bandit on repository Python tooling
        uses: PyCQA/bandit-action@67a458d90fa11fb1463e91e7f4c8f068b5863c7f
        with:
          targets: scripts
          severity: low
          confidence: low
      - name: Preserve Bandit SARIF for evidence review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-bandit-sarif-evidence
          path: results.sarif
          if-no-files-found: error
          retention-days: 14

  bearer-sast:
    name: Bearer open-source SAST and privacy analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Bearer OSS against supported JavaScript and Python sources
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc
        with:
          path: .
          format: sarif
          output: bearer-results.sarif
          exit-code: 0
      - name: Normalize empty Bearer SARIF results for GitHub schema compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("bearer-results.sarif")
          report = json.loads(path.read_text(encoding="utf-8"))
          runs = report.get("runs")
          if not isinstance(runs, list) or not runs:
              raise SystemExit("Bearer SARIF must contain at least one run")
          for run in runs:
              if not isinstance(run, dict):
                  raise SystemExit("Bearer SARIF contains an invalid run")
              run.setdefault("results", [])
              if not isinstance(run["results"], list):
                  raise SystemExit("Bearer SARIF results must be an array")
          path.write_text(json.dumps(report, indent=2) + "\\n", encoding="utf-8")
          PY
      - name: Upload Bearer SARIF
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: bearer-results.sarif
      - name: Preserve Bearer SARIF for evidence review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orvika-bearer-sarif-evidence
          path: bearer-results.sarif
          if-no-files-found: error
          retention-days: 14
