name: Temporary ORVIKA npm lockfile bootstrap

on:
  push:
    branches:
      - security/2026-11-23-npm-lock-bootstrap
    paths:
      - .github/tooling/package.json

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dedicated bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/2026-11-23-npm-lock-bootstrap
          persist-credentials: true

      - name: Generate and validate npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          npm install --package-lock-only --prefix .github/tooling --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('.github/tooling/package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error('Expected npm lockfile v3.');
          const missing = Object.entries(lock.packages).filter(([path, item]) =>
            path && item.resolved?.startsWith('https://registry.npmjs.org/') && !item.integrity
          );
          if (missing.length) throw new Error('Registry package entries are missing integrity metadata: ' + missing.length);
          console.log('npm lockfile integrity metadata verified for all registry package entries.');
          NODE

      - name: Commit lockfile to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tooling/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git commit -m 'Add integrity lockfile for CI tooling'
          git push origin HEAD:security/2026-11-23-npm-lock-bootstrap
