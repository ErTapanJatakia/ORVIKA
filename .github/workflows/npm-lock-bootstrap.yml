name: Temporary ORVIKA npm tooling lockfile bootstrap

on:
  push:
    branches:
      - security/2026-11-23-npm-lock-bootstrap
    paths:
      - .github/tooling/package.json

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout dedicated bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: security/2026-11-23-npm-lock-bootstrap
          persist-credentials: true

      - name: Generate and validate npm tooling lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --prefix .github/tooling --ignore-scripts --no-fund
          node scripts/verify-npm-tooling-lock.cjs

      - name: Commit lockfile to bootstrap branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/tooling/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git commit -m 'Update npm tooling lockfile for audited Vercel CLI'
          git fetch origin security/2026-11-23-npm-lock-bootstrap:refs/remotes/origin/security/2026-11-23-npm-lock-bootstrap
          git rebase origin/security/2026-11-23-npm-lock-bootstrap
          git push origin HEAD:security/2026-11-23-npm-lock-bootstrap
