name: Import official W3C WCAG badge

on:
  push:
    branches:
      - fix/self-host-wcag22-aa-badge
    paths:
      - .github/workflows/import-w3c-wcag-badge.yml

permissions:
  contents: write

jobs:
  import-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/self-host-wcag22-aa-badge
          fetch-depth: 0
      - name: Download and validate official W3C PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images
          curl --fail --location --silent --show-error --retry 3 \
            https://www.w3.org/WAI/WCAG22/wcag2.2AA-blue.png \
            --output assets/images/wcag2.2AA-blue.png
          python3 - <<'PY'
          import hashlib
          import struct
          from pathlib import Path
          p = Path("assets/images/wcag2.2AA-blue.png")
          data = p.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Downloaded file is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (368, 130):
              raise SystemExit(f"Unexpected image dimensions: {width}x{height}")
          print(f"Validated PNG: {width}x{height}; bytes={len(data)}")
          print(f"SHA-256: {hashlib.sha256(data).hexdigest()}")
          PY
      - name: Commit asset and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-w3c-wcag-badge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/wcag2.2AA-blue.png
          git add -u .github/workflows/import-w3c-wcag-badge.yml
          git commit -m "Add locally bundled official W3C WCAG 2.2 AA badge"
          git push origin HEAD:fix/self-host-wcag22-aa-badge
