name: orvika_wxscan_spike
description: Isolated browser runtime and decoder feasibility harness for wxscan; not part of the production app.
publish_to: none
version: 0.0.1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  wxscan: 0.1.7
  web: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/detect.tflite
    - assets/models/sr.tflite
    - assets/fixtures/qr.png
